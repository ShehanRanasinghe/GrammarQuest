<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question checker</title>
  <style>
    body { margin: 0; padding: 2rem; font: 20px/1.5 "Segoe UI", Roboto, Arial, sans-serif; color: #17214D; background: #F7FAFF; }
    main { max-width: 52rem; margin: 0 auto; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    .ok, .bad { padding: 1rem 1.4rem; border: 3px solid #17214D; border-radius: 1rem; font-weight: 600; }
    .ok { background: #37D6A0; }
    .bad { background: #FF7EB6; }
    li { margin: .6rem 0; }
    code { background: #fff; padding: .1rem .4rem; border-radius: .3rem; }
  </style>
</head>
<body>
  <main>
    <h1>Question checker</h1>
    <p>This page checks every question in <code>questions.js</code>. Open it after you add or change questions.</p>
    <div id="result"></div>
  </main>

  <script src="questions.js"></script>
  <script src="validate.js"></script>
  <script>
    (function () {
      var box = document.getElementById('result');
      var names = { fill: 'Fill the Blank', spot: 'Spot the Mistake', build: 'Sentence Builder', sort: 'Word Sorter' };

      if (typeof QUESTION_BANK === 'undefined' || typeof gqCheckBank !== 'function') {
        box.className = 'bad';
        box.textContent = 'The questions file could not be read. A comma, bracket or quote mark is probably missing near your last change. Undo that change and try again.';
        return;
      }

      var r = gqCheckBank(QUESTION_BANK);
      if (r.problems.length === 0) {
        box.className = 'ok';
        box.textContent = 'All ' + r.count + ' questions look good.';
        return;
      }

      box.className = 'bad';
      var html = '<p>' + r.problems.length + ' problem' + (r.problems.length > 1 ? 's' : '') + ' found. The game skips these questions until they are fixed.</p><ul>';
      r.problems.forEach(function (p) {
        var where = 'Grade ' + p.grade + ', ' + names[p.type] + (p.number ? ', question number ' + p.number : '');
        html += '<li><strong>' + where + ':</strong> ' + p.message.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>';
      });
      box.innerHTML = html + '</ul>';
    })();
  </script>
</body>
</html>
